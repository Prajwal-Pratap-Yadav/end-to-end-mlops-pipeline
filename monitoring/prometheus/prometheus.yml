# Prometheus scrape configuration for the churn MLOps stack.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Inference API: traffic, latency, predictions, feedback, loaded model.
  - job_name: churn-api
    static_configs:
      - targets: ["api:8000"]

  # Monitor: drift, live performance, retraining outcomes.
  - job_name: churn-monitor
    static_configs:
      - targets: ["monitor:8001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
