name: CI

# Pull requests and main. (Running on every branch push as well would run each PR
# commit twice.) workflow_dispatch allows a manual run on any branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"
  DO_NOT_TRACK: "true"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: ruff
        run: ruff check .
      - name: mypy (strict)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  docker:
    name: Docker stack end-to-end
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      # Faster monitoring cadence so the retraining loop completes within the job.
      MONITOR_INTERVAL_SECONDS: "10"
      RETRAIN_COOLDOWN_MINUTES: "0"
      MODEL_RELOAD_INTERVAL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Smoke test every service
        run: python3 scripts/smoke_test.py --stack --timeout 300

      - name: Normal traffic
        run: docker compose --profile demo run --rm simulator --n 600 --batch-size 50 --seed 1

      - name: Market shift -> drift -> retraining -> promotion -> hot reload
        run: |
          docker compose --profile demo run --rm simulator \
            --n 1500 --drift-strength 0.8 --batch-size 50 --seed 2
          for attempt in $(seq 1 60); do
            version=$(curl -fsS http://localhost:8000/model | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
            echo "attempt ${attempt}: API serves v${version}"
            if [ "${version}" != "1" ]; then
              echo "Champion replaced by automated retraining"
              docker compose exec -T api python -m src.registry list
              curl -fsS http://localhost:8001/report.json | python3 -c "import json,sys; r=json.load(sys.stdin); print('monitor status:', r['status'])"
              exit 0
            fi
            sleep 5
          done
          echo "The monitor did not promote a retrained model within 5 minutes"
          exit 1

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
