# Central configuration for the churn MLOps pipeline.
#
# Any value can be overridden with an environment variable of the form
#   MLOPS__<SECTION>__<KEY>=<value>        e.g. MLOPS__TRAINING__CV_FOLDS=3
# MLFLOW_TRACKING_URI (the standard MLflow variable) overrides mlflow.tracking_uri.
# Relative paths are resolved against the working directory (run commands from the repo root).

project:
  name: churn-mlops
  random_seed: 42

data:
  source: synthetic            # synthetic | csv
  csv_path: null               # required when source == csv
  n_samples: 6000              # rows generated by the synthetic source
  raw_path: data/raw/churn.csv # immutable snapshot written by every ingestion run
  test_size: 0.2
  min_rows: 500                # data contract: refuse to train on less
  max_missing_fraction: 0.2    # data contract: per-column null budget

training:
  experiment_name: churn-prediction
  cv_folds: 5
  selection_metric: roc_auc    # metric used to pick the best candidate in CV
  decision_threshold: 0.35     # favours recall: a missed churner costs more than an extra retention offer
  reference_max_rows: 5000     # training rows stored with the model as the drift reference
  candidates:
    - name: logistic_regression
      estimator: logistic_regression
      param_grid:
        C: [0.1, 1.0]
    - name: random_forest
      estimator: random_forest
      param_grid:
        n_estimators: [200]
        max_depth: [8, 14]
        min_samples_leaf: [5]
    - name: hist_gradient_boosting
      estimator: hist_gradient_boosting
      param_grid:
        learning_rate: [0.05, 0.1]
        max_depth: [4]
        max_iter: [200]

registry:
  model_name: churn-classifier
  champion_alias: champion      # the version production serves
  challenger_alias: challenger  # the most recent candidate
  promotion:
    metric: roc_auc             # champion vs challenger are compared on this metric
    min_improvement: 0.0        # challenger must be >= champion + this margin
    min_metrics:                # absolute quality gate every promoted model must pass
      roc_auc: 0.75
      f1: 0.45

mlflow:
  tracking_uri: sqlite:///mlflow.db

serving:
  prediction_log_path: data/predictions/predictions.db
  reload_interval_seconds: 30   # how often the API checks whether the champion alias moved
  max_batch_size: 1000
  admin_token: null             # set to require an X-Admin-Token header on POST /model/reload

monitoring:
  window_size: 1000             # most recent predictions compared against the reference data
  min_window_size: 200          # below this, drift is not evaluated
  min_labeled_for_performance: 100
  interval_seconds: 60          # cadence of the long-running monitor service
  metrics_port: 8001
  report_dir: reports/monitoring
  drift:
    n_bins: 10
    psi_threshold: 0.2          # PSI >= 0.2 is conventionally a significant shift
    p_value_threshold: 0.05     # reported alongside PSI (KS / chi-squared)
    drift_share_threshold: 0.15 # dataset drift when >= 15% of inputs (2 of 11) drift
  performance_thresholds:       # live metrics on labeled feedback below these trigger retraining
    roc_auc: 0.75
  retrain:
    enabled: true
    min_labeled_samples: 500    # need at least this much fresh ground truth to retrain
    max_fresh_rows: 5000        # most recent labeled predictions used for retraining
    holdout_fraction: 0.25      # newest slice of labeled data held out for champion vs challenger
    min_training_rows: 1000     # top up with reference data when fresh data is scarce
    cooldown_minutes: 30        # minimum gap between automated retraining runs

storage:
  s3:
    enabled: false              # publish data snapshots and monitoring reports to S3
    bucket: null
    prefix: churn-mlops
    endpoint_url: null          # set for S3-compatible stores (MinIO, LocalStack, ...)
    region: null
